name: Release

# Version tags (v*) build and publish a release with .exe and .dmg.
# Started by hand (Actions → Release → Run workflow) it only builds;
# the files are then attached to the run as artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: cargo test -p k65-color-core
        working-directory: src-tauri
      - run: npx tauri build --bundles nsis
      - name: Name the files
        shell: pwsh
        run: |
          $v = (Get-Content package.json | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item src-tauri/target/release/k65-plus-wireless-color-settings.exe "out/K65-Plus-Wireless-Color-Settings-$v-windows-x64-portable.exe"
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          Copy-Item $setup.FullName "out/K65-Plus-Wireless-Color-Settings-$v-windows-x64-setup.exe"
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: out/*

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: cargo test -p k65-color-core
        working-directory: src-tauri
      # Universal: runs on Apple Silicon and Intel.
      - run: npx tauri build --target universal-apple-darwin --bundles dmg
      - name: Name the file
        run: |
          v=$(node -p "require('./package.json').version")
          mkdir -p out
          cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg "out/K65-Plus-Wireless-Color-Settings-$v-macos-universal.dmg"
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: out/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out && sha256sum * > SHA256SUMS.txt && cd ..
          gh release create "$GITHUB_REF_NAME" out/* \
            --title "K65 Plus Wireless Color Settings $GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md
